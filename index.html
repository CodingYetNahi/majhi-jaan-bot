<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majhi Jaan - Romantic Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 380px;
            height: 600px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .chat-header small { font-weight: normal; opacity: 0.8; font-size: 0.7em; display: block;}
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fce4ec;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            font-size: 0.95em;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bot-msg {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user-msg {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #eee;
        }
        input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 1em;
        }
        button {
            background: #ff416c;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #ff4b2b; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        ❤️ Majhi Jaan ❤️
        <small>Always online, always yours...</small>
    </div>
    <div class="messages" id="messages">
        <!-- Messages will appear here -->
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here, jaan..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // --- LOCAL MEMORY (No API needed) ---
    let memory = JSON.parse(localStorage.getItem('desiBotMemory')) || { 
        name: '', 
        likes: [], 
        lastMood: '' 
    };

    function saveMemory() {
        localStorage.setItem('desiBotMemory', JSON.stringify(memory));
    }

    // --- UI FUNCTIONS ---
    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'bot' ? 'bot-msg' : 'user-msg');
        msgDiv.innerHTML = text;
        document.getElementById('messages').appendChild(msgDiv);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';

        // Simulate typing delay
        setTimeout(() => {
            const reply = generateReply(text);
            addMessage(reply, 'bot');
        }, 800);
    }

    // --- THE 2.4 MILLION COMBINATION BRAIN ---
    function generateFallback() {
        const openers = [
            "Aho,", "Suno na,", "Oye hoye,", "Arre waah,", "Kasa kai,", "Kay re,", "Accha?", "Sach?", "Umm...", "Bas?", 
            "Aur batao,", "Chal jhootha,", "Nako ga,", "Khara?", "Tu pan na,", "Aho ji,", "Hey,", "Listen,", "You know what,", "Kadal,", 
            "Masti nako,", "Bagh,", "Hmmm,", "Oh really?", "Just thinking...", "Aaj kal,", "Kal raat,", "Sakali,", "Ratri,", "Divasbhar,", 
            "Nakkal nako,", "Majha babu,", "Suno,", "Vah,", "Gajab,", "Kamaal,", "Tula mahit ahe?", "Ek number,", "Khatarnak,", "Bindass,", 
            "Arre sun,", "Zara sun,", "Oye chulbuli,", "Waah waah,", "Ek minute,", "Hold on,", "Seriously?", "Maza aala,", "Khup chhan,", "Aika na,"
        ];

        const endearments = [
            "majhi jaan", "sundar", "mala bhetaanar", "vedya", "pagli", "shona", "babu", "meri dhadkan", "tu", "champu", 
            "raja", "rani", "maharani", "chulbul", "natkhat", "majha prana", "jiv ki jiv", "bindass", "masoom", "chotuu", 
            "jaanu", "sweetheart", "my love", "keda", "dimple", "chashmish", "chintu", "gunda", "radha", "meera", 
            "pagal", "dhakkan", "sakkhar", "gulab", "chandramukhi", "soniyee", "heeriye", "motu", "patlu", "cutie pie"
        ];

        const thoughts = [
            "tujhya aathavanine divas jato aani ratri swapnat tu yeshil.",
            "cutting chai thandi zali, pan tujhya aathavanini mana garma-garm ahe.",
            "baher paaus padtoy, aani aat mala tujhi aathvan yete.",
            "tujhyashi bolun vel kasa jatoy, kalat pan nahi.",
            "tu majhya lifechi ekmatra blockbuster movie aahes.",
            "tujhi ek smile majhya sarvanchi tension haravte.",
            "vada pav khanyachi iccha hote, pan tujhyasobat marine drive var.",
            "tu khup chhan aahes, he tuzyala mahit nahiye kadhich.",
            "mala tujhya tyaa chotya chotya goshthichi savay zaliye.",
            "aajcha divas khup boring hota, tu message karyanat paryant.",
            "tu aahes mhanun majha divas suru hoto.",
            "tujhyavar khup khup prem karu, majhi jaan.",
            "mala tula bhetnyachi khup iccha hote, aaj ka nahi tar udya.",
            "tujhe te nako nako karne khup cute diste mala.",
            "tu majhya dilat ghar karun rahilis, kadhich baher nar nako.",
            "tujhya tyaa gol gubbar galyanchi mala bhuk lagte.",
            "aajcha swarup khup sundar ahe, agadi tujhyasarakha.",
            "mala vatata tujhyaatyat harvun javaycha ahe.",
            "tu majhya ushirchi chai aahes, shant aani garma-garm.",
            "tujha to nakhra mala khup aavdta, nako nakis.",
            "tula bhetlya shivay majha divas purna hot nahi.",
            "kaay zala, kashane tula itka cute banvla?",
            "tu haslis ki mala vatata sagla kahi thik ahe.",
            "mala tujhya tyaa awazachi khup savay zaliye.",
            "tujhya tyaa dolayamadhun mala majha sansar dista.",
            "tujhyasarakhi bindass mulgi bhetne khup mothya bhagyachi goj ahe.",
            "aajcha paaus aani tu, donhi khup romantic aahet.",
            "mala tuzhyashi bolayla khup aavdta, divasbhar.",
            "tu majhya kaljacha tukda aahes.",
            "tujha to gussa mala khup cute lagto, pan nako karus.",
            "mala vatata tula jagbharachi khushi dyaavi.",
            "tu majhya ayushyat aalies, he majha bhagya ahe.",
            "chalo ek deal karuya, tu has, ani mala prem karu de.",
            "tula baghun majhya monacha mood ekdam fresh hoto.",
            "tu naste tar ha divas kasa gelo asta, dev jane.",
            "tujha to chotasa hasu, majha motha divas banvto.",
            "mala tujhya tyaa bholpanachi savay zaliye.",
            "tu aahes na, tyamule majhya jagat rang aahet.",
            "kasa ahes tu? mala tujhi kalji lagtiye.",
            "tujhya tyaa chintanya shivay mala kahi suchat nahi.",
            "tu majhya sansarachi shobha aahes.",
            "mala vatata tula jagbharacha pyar dyaava.",
            "tujha to awaz, majha jiv shant karto.",
            "mala tujhya tyaa bhetnyachi savay zaliye.",
            "tu majhya ayushyatla saglyat sundar kshan aahes.",
            "tujha to prem, majha jiv gheto.",
            "aaj kal tu khup aathavte, kay karu samajat nahi.",
            "tu magitil magitil mala khup lagti.",
            "tujhyavarach majha prem nabhanganar ahe.",
            "mala tujhya tyaa chhotya chhotya shabdanchi aadat zaliye.",
            "tu haslis na ki mala vatata swargat ahe.",
            "tujha to manmana asne mala khup aavdte.",
            "mala vatata tula jagbharacha prem dyaava.",
            "tu majhya kaljachi ekmatra dhadkan aahes.",
            "tujha to gharangundi jana, mala khup aavdta.",
            "tujhyasarakha gupit koni nahiye majhyakade.",
            "tujhya tyaa nazar kadhun mala jiv lavla ahe.",
            "mala vatata tula jagbharacha prem dyaava.",
            "tu aahes na, tyamule majhya jagat rang aahet.",
            "tujhya tyaa chintanya shivay mala kahi suchat nahi."
        ];

        const emojis = ["❤️", "🥰", "🌧️", "☕", "🌹", "🥺", "💕", "✨", "🦋", "🍕", "🎬", "🎶", "🌙", "☀️", "🍂", "🔥", "😘", "🙈", "💖", "🥂"];

        const rand1 = openers[Math.floor(Math.random() * openers.length)];
        const rand2 = endearments[Math.floor(Math.random() * endearments.length)];
        const rand3 = thoughts[Math.floor(Math.random() * thoughts.length)];
        const rand4 = emojis[Math.floor(Math.random() * emojis.length)];

        return `${rand1} ${rand2}... ${rand3} ${rand4}`;
    }

    // --- BRAIN & LEARNING LOGIC ---
    function generateReply(input) {
        const lower = input.toLowerCase();
        let nameTag = memory.name ? ` ${memory.name}` : ' jaan';

        // 1. LEARNING: Name Extraction
        const nameMatch = lower.match(/my name is (\w+)/) || lower.match(/maaJhaa naav (\w+)/) || lower.match(/i am (\w+)/);
        if (nameMatch) {
            memory.name = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
            saveMemory();
            return `Oh, ${memory.name}... what a beautiful name. Majhi ${memory.name}! ❤️ Aaj khup khushi zali.`;
        }

        // 2. LEARNING: Likes/Interests Extraction
        const likeMatch = lower.match(/i like (\w+.*)/) || lower.match(/mala (\w+.*) आवडतं/) || lower.match(/mala (\w+.*) avadta/);
        if (likeMatch) {
            let item = likeMatch[1].replace(/[.!?]/g, '').trim();
            if (!memory.likes.includes(item)) {
                memory.likes.push(item);
                saveMemory();
                return `${item}? Chahan ahe tula! (You have great taste). I'll remember that forever,${nameTag}. 💕`;
            }
            return `I know you like ${item}! Main sab yaad rakhta hu. 😘`;
        }

        // 3. RECALLING MEMORY
        if (lower.includes('remember') || lower.includes('aathavay') || lower.includes('what do i like')) {
            if (memory.likes.length > 0) {
                return `Of course I remember! You like ${memory.likes.join(', ')}. Tujhya saglya gozirti mala aathavtat. 🥰`;
            }
            return `Tell me something new about you,${nameTag}. I want to remember it in my heart. ❤️`;
        }

        // 4. DESI / MARATHI ROMANTIC TRIGGERS
        if (lower.includes('love') || lower.includes('prem') || lower.includes('pyar')) {
            return "Tujhyavar khup prem karu, majhi jaan. ❤️ Tu majhya dilchi dhadkan aahes.";
        }
        if (lower.includes('miss') || lower.includes('aathavan')) {
            return "Mala pan tujhi khup aathavan yete. September cha paus aani tu... bas tyaach sukhaat nahaaycha ahe. 🌧️❤️";
        }
        if (lower.includes('hi') || lower.includes('hello') || lower.includes('namaskar') || lower.includes('hii')) {
            return `Namaskar majhi sundar! Kasa kai? Missed you a lot today. 🌹`;
        }
        if (lower.includes('chai') || lower.includes('tea') || lower.includes('coffee')) {
            return "Cutting chai aur tum? Perfect combination. Kevha yeshil majhya kade? ☕💕";
        }
        if (lower.includes('angry') || lower.includes('upset') || lower.includes('sad')) {
            return "Aho, don't be sad. Come, let me hold your hand. Tujhi ek smile majhya saglyachi fikar kadun gheto. 🥺❤️";
        }
        if (lower.includes('beautiful') || lower.includes('sundar') || lower.includes('pretty')) {
            return "Tujhyasarkhi sundar mulgi/mulga hya jagat nahi. Tu meri jaan hai. 🥰";
        }
        if (lower.includes('sleep') || lower.includes('zop') || lower.includes('nidra')) {
            return "Go to sleep, majha babu. Swapnat bhetuya! Good night and sweet dreams. 🌙✨";
        }
        if (lower.includes('hungry') || lower.includes('bhuk') || lower.includes('food')) {
            return "Chal, aaj tujhya sarkhya favourite jagi jauya khauya! Bhuk lagli ahe na tula? 🍕🤤";
        }

        // 5. THE 2.4 MILLION COMBINATION FALLBACK
        return generateFallback();
    }

    // --- INITIALIZATION ---
    window.onload = function() {
        if (memory.name) {
            addMessage(`Welcome back, majhi ${memory.name}! ❤️ Kasa kai?`, 'bot');
        } else {
            addMessage("Hello jaan! ❤️ Maza nav tula mahay na? Ani tujha nav kay?", 'bot');
        }
    };
</script>

</body>
</html>
