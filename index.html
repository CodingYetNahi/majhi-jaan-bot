<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b4235a" />
  <meta name="description" content="Majhi Jaan is a responsive Marathi-friendly conversational companion that can remember preferences and look up public information from the web." />
  <title>Majhi Jaan — Marathi Internet Chat Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" aria-label="Majhi Jaan chat">
    <header class="chat-header">
      <div>
        <h1>❤️ Majhi Jaan</h1>
        <p id="statusText">Online · Marathi + English · Web-aware</p>
      </div>
      <button id="clearBtn" class="icon-btn" type="button" title="Clear chat" aria-label="Clear chat">↻</button>
    </header>

    <section id="messages" class="messages" aria-live="polite" aria-label="Conversation"></section>

    <div id="suggestions" class="suggestions" aria-label="Suggestions">
      <button type="button" data-prompt="Who is Chhatrapati Shivaji Maharaj?">Shivaji Maharaj</button>
      <button type="button" data-prompt="Tell me about Pune">About Pune</button>
      <button type="button" data-prompt="Remember that I like cutting chai">Remember me</button>
    </div>

    <form id="chatForm" class="composer" autocomplete="off">
      <label class="sr-only" for="userInput">Message</label>
      <textarea id="userInput" rows="1" maxlength="1200" placeholder="Type here, jaan…" enterkeyhint="send"></textarea>
      <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">Send</button>
    </form>
  </main>

  <template id="messageTemplate">
    <article class="message-row">
      <div class="bubble"></div>
      <div class="sources"></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
